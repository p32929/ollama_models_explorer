name: Update model catalogue

# Rebuilds public/ollama-catalogue.json (every model on ollama.com) once a week.
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Crawl ollama.com
        run: node scripts/crawl-catalogue.mjs
      - name: Commit the new list
        run: |
          if git diff --quiet -- public/ollama-catalogue.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ollama-catalogue.json
          git commit -m "Update model catalogue"
          git push
